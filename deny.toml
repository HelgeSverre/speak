# Licence allowlist (spec §14 item 2): cargo deny check licenses

[graph]
all-features = false

[licenses]
# General-purpose libraries under permissive licences only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true
